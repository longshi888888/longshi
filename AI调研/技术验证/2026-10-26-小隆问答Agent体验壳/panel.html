<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>小隆 · 公司问答体验</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#31473e;font:14px/1.7 'Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}header{padding:25px 30px 19px;background:#fbfaf7;border-bottom:1px solid #e1e4da;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}small{font-size:11px;color:#879284}.tag{font-size:11px;border-radius:15px;background:#e9eee0;color:#70865c;padding:4px 11px}button{border:1px solid #dce1d4;border-radius:12px;padding:8px 13px;background:#fffdf7}button:hover{background:#f6edd9}#controls{display:flex;gap:8px;align-items:center}#scope{padding:12px 30px;background:#eeefe6;font-size:12px;color:#7c8871}#content{height:calc(100vh - 250px);overflow:auto;padding:24px 30px}#starter h2{font-size:27px;line-height:1.5;font-weight:500;margin:10px 0}.muted{color:#889783;font-size:12px}.suggest{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.suggest button{font-size:12px}.msg{margin:0 0 22px}.question{text-align:right;margin-bottom:12px;white-space:pre-wrap}.question span{display:inline-block;background:#e5ebdf;padding:10px 15px;border-radius:15px 15px 2px 15px;max-width:90%;text-align:left}.answer{background:#fffefb;padding:21px;border:1px solid #e2e6dc;border-radius:18px}.answer h3{margin:0 0 8px;font-size:17px}.answer p{white-space:pre-wrap;word-break:break-word;font-size:13px;margin:8px 0}.answer.missing{background:#fcf8ed;border-color:#e6dac0}.answer.warning{border-color:#dfcba7}.engine{font-size:10px;color:#8d9c83}.metrics{display:flex;gap:9px;margin:15px 0}.metric{padding:10px;background:#f1f4eb;flex:1;border-radius:12px}.metric strong{font-size:22px;display:block;font-weight:500}.metric span{font-size:10px;color:#7e9072}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:8px;border-bottom:1px solid #e5e9de}th{color:#84917b;font-weight:500}.refs{font-size:10px;color:#8a967e;margin-top:13px}.refs button{font-size:11px}.thinking{color:#a58e5e;font-size:12px}footer{height:115px;padding:15px 30px;background:#f5f4ef;border-top:1px solid #e2e6da}form{display:flex;gap:8px}#question{flex:1;min-width:0;border:1px solid #dce1d3;border-radius:14px;padding:13px;background:#fffefb;outline:none}#send{background:#71895a;color:white;padding:10px 21px}#footnote{font-size:10px;color:#929c8a;margin-top:7px}dialog{border:1px solid #dce3d2;border-radius:20px;padding:27px;max-width:620px;width:90vw;color:#344b3e;background:#fcfbf7}dialog::backdrop{background:#243c3655}dialog h2{font-size:18px;margin-top:0}label{display:block;font-size:12px;margin:12px 0 4px}dialog input[type=text],dialog input[type=password]{display:block;width:100%;padding:9px;border:1px solid #d9e1d0;border-radius:9px;background:#fff}dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}#settingMessage{font-size:12px;color:#9b6c44;white-space:pre-wrap}pre{white-space:pre-wrap;word-break:break-all;max-height:50vh;overflow:auto;background:#f0f3e9;padding:15px;border-radius:12px;font-size:11px}.switch.selected{background:#dfe8d4;border-color:#a7bc8e}#notice{font-size:11px;color:#986c4a}</style></head><body>
<header><div><h1>小隆 · 公司问答体验</h1><small>先把问题问清楚，再把依据带回来</small></div><div id="controls"><button class="switch selected" data-mode="business">查业务</button><button class="switch" data-mode="chat">陪聊</button><button id="settingsButton">设置</button><button id="hide">收起</button></div></header>
<div id="scope"><span class="tag">全部虚构 · 合成数据</span> <span id="engineStatus">读取状态…</span></div>
<main id="content"><section id="starter"><h2>想了解哪件事？</h2><div class="muted">体验同一问题如何查到记录、解释差异，或明确证据不足。</div><div class="suggest"><button data-q="查一下送货样本">看看送货样本</button><button data-q="为什么有300和280两个金额？">金额为什么不同？</button><button data-q="这两笔送货已经到账了吗？">已经到账了吗？</button><button data-q="查DEMO-A999">试试不存在的单号</button><button data-q="ERP接到哪一步？">现在接入到哪？</button></div><div id="notice">目前不是正式企业系统，尚未接ERP。真实业务权限和口径需在接入前核实。</div></section><div id="messages" aria-live="polite"></div></main>
<footer><form id="form"><input id="question" aria-label="向小隆提问" placeholder="输入问题…" maxlength="2000" autocomplete="off"><button id="send">发送</button></form><div id="footnote">查业务：数字来自受控工具 · 陪聊：模型交流，不作为业务证据 <button id="clear" style="border:0;background:none;font-size:10px;padding:0;float:right">清除本机会话</button></div></footer>
<dialog id="settings"><h2>给小隆接上模型</h2><p class="muted">问题会发送到你配置的模型服务。当前业务数据全部为虚构；角色渲染与本地演示不需要密钥。</p><label><input id="useModel" type="checkbox"> 使用模型理解问题和陪聊</label><label>API地址</label><input id="baseUrl" type="text" value="https://api.deepseek.com"><label>模型名</label><input id="modelName" type="text" value="deepseek-flash"><label>API密钥（留空保留现有密钥）</label><input id="apiKey" type="password" autocomplete="off" placeholder="只在本机填写，不用发给别人"><label>希望小隆怎么称呼你</label><input id="nickname" type="text" maxlength="40" value="你"><div class="muted">密钥用当前Windows账户加密保管；会话只保存在本机项目外，可随时清除。</div><p id="settingMessage"></p><div class="row"><button id="removeKey">删除密钥</button><button id="checkModel">测试已保存接口</button><button id="closeSettings">返回</button><button id="saveSettings">保存</button></div></dialog>
<dialog id="source"><h2>本次查询的来源</h2><div class="muted">下面是虚构样本原文，不是实际公司单据。</div><pre id="sourceText"></pre><button id="closeSource">返回</button></dialog>
<style>body{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) 115px;overflow:hidden}#content{height:auto;min-height:0}footer{height:115px}</style><script src="./panel.js"></script></body></html>
