<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>小隆 · 混元图生3D检查</title>
<style>body{margin:0;background:#f6f4ef;color:#33423d;font:14px 'Microsoft YaHei',sans-serif}header{padding:22px 32px;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0 0 7px}p{font-size:12px;color:#89918a;margin:0}#stage{height:calc(100vh - 155px);min-height:400px;margin:0 24px;border:1px solid #e9e5dc;border-radius:28px;background:radial-gradient(circle,#fffbf1,#f1ede5);overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}footer{padding:17px 30px;display:flex;gap:9px;align-items:center}button{border:1px solid #d9ddd2;background:#fffdf6;color:#63735d;border-radius:9px;padding:9px 16px;cursor:pointer}#info{margin-left:auto;font-size:12px;color:#88937e}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><header><div><h1>小隆 · 图生3D模型检查</h1><p>拖动旋转，滚轮缩放。这里加载的是模型生成器输出的真实GLB文件。</p></div><span id="status">加载模型中…</span></header><div id="stage"></div><footer><button data-angle="0">正面</button><button data-angle="1.57079632679">侧面</button><button data-angle="3.14159265359">背面</button><button data-angle="-1.57079632679">另一侧</button><span id="info"></span></footer>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from './vendor/GLTFLoader.js';import {OrbitControls} from './vendor/OrbitControls.js';import {RoomEnvironment} from './vendor/RoomEnvironment.js';
const host=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;host.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,.05,100);camera.position.set(0,.1,4.5);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);
const pmrem=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.6;room.dispose();pmrem.dispose();scene.add(new THREE.HemisphereLight('#fff8e8','#a7aaa2',1.8));const light=new THREE.DirectionalLight('#fff9f0',2.0);light.position.set(-3,4,5);scene.add(light);
const name=new URL(location.href).searchParams.get('paint')==='1'?'xiaolong-textured.glb':'xiaolong-gray.glb';
new GLTFLoader().load('./model-assets/'+name,gltf=>{const model=gltf.scene;const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3());model.position.sub(center);scene.add(model);let faces=0;model.traverse(m=>{if(m.isMesh){faces+=(m.geometry.index?.count||m.geometry.attributes.position.count)/3;if(name.includes('gray'))m.material=new THREE.MeshStandardMaterial({color:'#b7bab5',roughness:.65,metalness:.02});}});document.querySelector('#status').textContent=name.includes('gray')?'几何已生成 · 尚未上色':'带纹理模型';document.querySelector('#info').textContent=Math.round(faces).toLocaleString()+' 个三角面';window.generatedModel={model,faces,controls,camera,renderer};document.documentElement.dataset.model='ready';},undefined,error=>{document.querySelector('#status').textContent='模型未加载完成';console.error(error)});
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{const angle=Number(b.dataset.angle);camera.position.set(Math.sin(angle)*4.5,.1,Math.cos(angle)*4.5);controls.target.set(0,0,0);controls.update()});new ResizeObserver(()=>{const r=host.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}).observe(host);let last=0;function frame(t){requestAnimationFrame(frame);if(document.hidden||t-last<33)return;last=t;controls.update();renderer.render(scene,camera);}requestAnimationFrame(frame);
</script></body></html>
