<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>小隆随手聊</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font:12px/1.75 'Segoe UI','Microsoft YaHei',sans-serif;color:#354a3c}.shell{position:absolute;inset:8px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#fffefa;border:1px solid #dfe7d6;border-radius:22px;box-shadow:0 5px 16px #243e2517;overflow:hidden}header{padding:17px 18px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #edf0e5;background:#f5f8ec;-webkit-app-region:drag}.mark{width:30px;height:30px;border-radius:11px;background:#dce9bf;color:#5f7e4c;display:grid;place-items:center;font-weight:700}h1{font-size:14px;line-height:1.3;margin:0}small{font-size:9px;color:#94a183}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #e0e7d6;border-radius:10px;background:#fffdf7;color:#617b50;padding:6px 10px}button:hover{background:#eef5de}button:disabled{opacity:.45;cursor:wait}header button{margin-left:auto;border:0;background:transparent;-webkit-app-region:no-drag;font-size:16px;padding:0 4px}main{overflow:auto;padding:15px 18px;scrollbar-width:thin}.welcome{font-size:15px;line-height:1.8;margin:3px 0 10px}.suggest{display:flex;gap:5px;flex-wrap:wrap}.suggest button{font-size:10px;padding:4px 8px}.question{font-size:11px;background:#edf4df;border-radius:12px 12px 3px 12px;padding:9px 11px;margin:0 0 13px;white-space:pre-wrap;overflow-wrap:anywhere}.reply{font-size:12px;line-height:1.85;overflow-wrap:anywhere}.reply p{margin:0 0 11px}.reply h1,.reply h2,.reply h3{font-size:13px;line-height:1.8;margin:14px 0 9px}.reply ul,.reply ol{padding-left:19px}.reply li{margin:4px 0}.reply code{background:#eff3e7;padding:2px 4px;border-radius:4px;font:11px Consolas,monospace}.reply pre{white-space:pre-wrap;background:#f2f5eb;padding:10px;border-radius:10px}.reply table{border-collapse:collapse;font-size:10px;display:block;overflow:auto}th,td{padding:6px;border:1px solid #e4eadb;min-width:65px}.status{font-size:10px;color:#8fa079;margin-top:10px}.status.busy:after{content:' ▍';animation:blink 1s infinite}.reply.error{color:#9c7955}.result-action{font-size:10px;margin-top:9px;background:#edf3df}.context{font-size:9px;color:#9ca78f;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}footer{padding:12px 14px 11px;border-top:1px solid #ebefdf}form{display:flex;gap:6px;align-items:flex-end}textarea{flex:1;min-width:0;resize:none;border:1px solid #dce6ce;border-radius:12px;padding:9px 10px;background:#fbfdf5;line-height:1.5;outline:none;color:#364b38;font-size:12px}textarea:focus{border-color:#a0bb86}#send{background:#547348;color:white;border-color:#547348;padding:9px 12px}#cancel{background:#fff2d8;color:#a08450}.foot{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:9px;color:#9aa58e}.foot button{padding:3px 7px;font-size:9px}.foot #office{margin-left:auto}.hide{display:none!important}#mic.recording{background:#f4e5d1;color:#9f7953}@keyframes blink{50%{opacity:.3}}
</style><link rel="stylesheet" href="./experience.css"></head><body><div class="shell"><header><div class="mark">隆</div><div><h1>小隆随手聊</h1><small>在你身边，也能替你办事</small></div><button id="close" title="收起，正在运行的任务会继续">×</button></header><main id="content"><div class="context" id="context">正在读取当前会话…</div><div id="history" class="quick-history"></div><div id="welcome"><div class="welcome">我在呢。<br>聊一句，或交代一件小事。</div><div class="suggest"><button data-prompt="你好，小隆，今天一起把工作理清楚。">打个招呼</button><button data-prompt="列出当前资料文件夹的资料清单。">看看资料</button><button data-prompt="帮我整理今天要做的事，先问我一两个关键问题。">理理待办</button></div></div><div id="question" class="question hide"></div><div id="reply" class="reply"></div><div id="status" class="status" role="status"></div><div class="answer-actions"><button id="read" class="hide">朗读</button><button id="resume" class="hide">继续这项任务</button><button id="pause" class="hide">暂停</button></div><div id="speechStatus" class="speech-status" role="status"></div><button id="result" class="result-action hide">去工作台查看成果 ↗</button></main><footer><form id="form"><textarea id="input" rows="2" maxlength="2000" placeholder="跟小隆说一句…" aria-label="跟桌面小隆交谈"></textarea><button id="cancel" type="button" class="hide">停止</button><button id="send">发送</button></form><div class="foot"><button id="mic" type="button">语音</button><span id="hint">Enter发送 · Esc收起</span><button id="office">工作台 ↗</button></div></footer></div><script src="./vendor/markdown-it.min.js"></script><script src="./speech.js"></script><script src="./quick.js"></script></body></html>
